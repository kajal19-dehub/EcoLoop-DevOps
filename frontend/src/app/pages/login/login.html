<div class="login-container">
  <aside class="auth-visual" aria-label="EcoLoop pickup snapshot">
    <div class="visual-overlay">
      <span class="eyebrow">Tonight's route</span>
      <h1>3 collections ready for dispatch</h1>
      <div class="route-summary">
        <div><strong>128 kg</strong><span>sorted waste</span></div>
        <div><strong>5:30 PM</strong><span>next pickup</span></div>
      </div>
    </div>
  </aside>

  <div class="login-card">
    <div class="card-header">
      <span class="brand-mark"><i class="fa-solid fa-recycle"></i></span>
      <h2>Welcome back</h2>
      <p>Sign in to manage pickups, assignments, and recycling progress.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >
        <span class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Valid email is required
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter your password"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
        <span class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password is required
        </span>
      </div>

      <div class="alert alert-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isSubmitting">
        <i class="fa-solid fa-right-to-bracket"></i>
        {{ isSubmitting ? 'Signing in...' : 'Login' }}
      </button>
    </form>

    <div class="card-footer">
      <p>Don't have an account? <a routerLink="/register">Sign up here</a></p>
    </div>
  </div>
</div>
